<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070912">
  <title>StreamArena — Offline</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070912;color:#f4f6ff;font:16px/1.5 system-ui,sans-serif;padding:24px;box-sizing:border-box}
    main{max-width:460px;text-align:center;padding:28px;border:1px solid #293451;border-radius:16px;background:#0d1322}
    h1{margin-top:0}p{color:#b7c3df}button{border:0;border-radius:9px;padding:11px 18px;background:#6844ff;color:white;font:inherit;font-weight:700}
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>StreamArena needs an internet connection for live streams, chat, sign-in and other online features.</p>
    <p>Reconnect to the internet, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
