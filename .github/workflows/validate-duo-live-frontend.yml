name: Validate Duo Live frontend draft

on:
  push:
    branches:
      - "feat/live-floating-controls-current-base"
    paths:
      - "index.html"
      - ".github/workflows/validate-duo-live-frontend.yml"
  pull_request:
    paths:
      - "index.html"
      - ".github/workflows/validate-duo-live-frontend.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parse inline application JavaScript
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('No inline script tags found');
          let parsed = 0;
          for (const [index, match] of scripts.entries()) {
            if (!match[1].trim()) continue;
            new Function(match[1]);
            parsed++;
          }
          if (!parsed) throw new Error('No inline application scripts were parsed');
          console.log(`Parsed ${parsed} inline script(s)`);
          NODE
      - name: Validate floating controls accessibility and supported media actions
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const checks = [
            'role="group" aria-label="Live broadcast controls" aria-hidden="true"',
            'aria-expanded',
            'aria-hidden',
            'firstVisible?.focus()',
            'button.getClientRects().length>0',
            "liveControlPopover?.addEventListener('focusout'",
            "aria-controls=\"liveBroadcastControls\"",
            'setLiveControlMenuOpen(false,true)',
            "event.key==='Escape'",
            '!liveControlPopover?.contains(event.target)',
            'const room=activeLiveRoom||activeDuoCohostRoom',
            "document.getElementById('liveScreenShareBtn').style.display='none'",
            "typeof navigator.mediaDevices?.getDisplayMedia!=='function'",
            "typeof activeLiveRoom.localParticipant.setScreenShareEnabled!=='function'",
            'window.isSecureContext',
            'restoreDuoCameraTracks(room,stage,true)'
          ];
          for (const required of checks) {
            if (!html.includes(required)) throw new Error('Floating live controls are missing: ' + required);
          }
          console.log('Validated focus management, ARIA state, co-host camera/mic controls and screen-share capability checks.');
          NODE
      - name: Check duplicate HTML IDs
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(match => match[1]);
          const duplicates = ids.filter((id, index) => ids.indexOf(id) !== index);
          if (duplicates.length) throw new Error('Duplicate IDs: ' + [...new Set(duplicates)].join(', '));
          console.log(`Checked ${ids.length} HTML IDs`);
          NODE
