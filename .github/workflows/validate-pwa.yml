name: PWA asset validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-pwa:
    name: Validate PWA manifest and service worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('manifest.webmanifest', 'utf8')); console.log('PWA manifest JSON is valid.')"
      - name: Validate service worker JavaScript syntax
        run: node --check service-worker.js
      - name: Check required offline fallback
        run: test -s offline.html
